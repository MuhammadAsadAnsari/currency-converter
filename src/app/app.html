<div class="container py-4" style="max-width: 480px;">
  <h2 class="text-center mb-4">Currency Converter</h2>

  <!-- Amount input -->
  <div class="mb-3">
    <label for="amount" class="form-label">Amount</label>
    <input
      type="number"
      id="amount"
      class="form-control"
      [(ngModel)]="amount"
      min="0"
    />
  </div>

  <!-- From currency -->
  <div class="mb-3">
    <label for="from" class="form-label">From Currency</label>
    <select id="from" class="form-select" [(ngModel)]="from">
      <option *ngFor="let code of symbols | keyvalue" [value]="code.key">
        {{ code.key }} - {{ code.value }}
      </option>
    </select>
  </div>

  <!-- To currency -->
  <div class="mb-3">
    <label for="to" class="form-label">To Currency</label>
    <select id="to" class="form-select" [(ngModel)]="to">
      <option *ngFor="let code of symbols | keyvalue" [value]="code.key">
        {{ code.key }} - {{ code.value }}
      </option>
    </select>
  </div>

  <!-- Convert button -->
  <div class="d-grid">
    <button class="btn btn-primary" (click)="convert()" [disabled]="loading">
      Convert
    </button>
  </div>

  <!-- Loader -->
  <div class="text-center mt-3" *ngIf="loading">
    <mat-spinner diameter="30"></mat-spinner>
  </div>

  <!-- Result -->
  <div class="mt-3" *ngIf="result !== null && !loading">
    <h5>
      {{ amount }} {{ from }} = {{ getFormattedResult() }} {{ to }}
    </h5>
  </div>

  <!-- Conversion History -->
  <div *ngIf="history.length > 0" class="mt-4">
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Conversion History</h5>
      <button class="btn btn-sm btn-outline-danger" (click)="clearHistory()">
        Clear
      </button>
    </div>
    <ul class="list-group mt-2">
      <li *ngFor="let entry of history" class="list-group-item d-flex justify-content-between">
        <div>
          {{ entry.amount }} {{ entry.from }} → {{ entry.to }} =
          <strong>{{ entry.result.toFixed(2) }}</strong>
        </div>
        <small>{{ entry.date }}</small>
      </li>
    </ul>
  </div>
</div>
